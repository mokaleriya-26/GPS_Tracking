spring:
  application:
    name: gps-tracking-backend

  # ============================================================
  # DATABASE - PostgreSQL
  # ============================================================
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gps_tracking}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ============================================================
  # JPA / HIBERNATE
  # ============================================================
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

  # ============================================================
  # FLYWAY MIGRATIONS
  # ============================================================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false

  # ============================================================
  # SPRING MAIL (Email Notifications)
  # ============================================================
  mail:
    host: ${EMAIL_HOST:smtp.gmail.com}
    port: ${EMAIL_PORT:587}
    username: ${EMAIL_USER:}
    password: ${EMAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 15000
          timeout: 15000
          writetimeout: 15000

  # ============================================================
  # MULTIPART FILE UPLOAD (for reports/CSV)
  # ============================================================
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

  # ============================================================
  # JACKSON JSON
  # ============================================================
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss
    time-zone: Asia/Kolkata
    serialization:
      write-dates-as-timestamps: false

# ============================================================
# SERVER
# ============================================================
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

# ============================================================
# SPRINGDOC / SWAGGER
# ============================================================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    enabled: true
    try-it-out-enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

# ============================================================
# NOTIFICATION CONFIGURATION
# ============================================================
notification:
  email:
    fleet: ${FLEET_EMAIL:fleet@trackfleet.com}
    manager: ${MANAGER_EMAIL:manager@trackfleet.com}
    from: ${EMAIL_FROM:no-reply@trackfleet.com}
  sms:
    msg91:
      auth-key: ${MSG91_AUTH_KEY:}
      template-id: ${MSG91_SMS_TEMPLATE_ID:}
      sender-id: ${MSG91_SENDER_ID:}
      api-url: https://control.msg91.com/api/v5/flow/
    fleet-phone: ${FLEET_PHONE:}
    manager-phone: ${MANAGER_PHONE:}

# ============================================================
# PYTHON AI SERVICE
# ============================================================
ai:
  service:
    url: ${PYTHON_AI_SERVICE_URL:http://localhost:8000}
    timeout: 30
    enabled: true

# ============================================================
# REPORT GENERATION
# ============================================================
reports:
  output-dir: ${REPORTS_DIR:./reports/generated}

# ============================================================
# LOGGING
# ============================================================
logging:
  level:
    com.gps.tracking: INFO
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
    root: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
